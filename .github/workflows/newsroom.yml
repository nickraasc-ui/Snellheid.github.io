name: Newsroom

on:
  schedule:
    # Wakes hourly but only writes when the newest article is 3.5h+ old (see NEWS_MIN_GAP_MIN in the script),
    # so a run GitHub skips is caught up an hour later. Skipped checks spend no AI tokens.
    - cron: '17 * * * *'
  # "Run workflow" button (always writes an article), and the hourly kick from Supabase pg_cron,
  # which sends force=false so it only writes when one is due. GitHub's own schedule is unreliable.
  workflow_dispatch:
    inputs:
      force:
        description: 'Write an article even if the last one is recent'
        type: boolean
        default: true
      headline:
        description: 'Optional: write about this headline instead of a random one'
        type: string
        default: ''
      headline_url:
        description: 'Optional: link to the story'
        type: string
        default: ''
      headline_source:
        description: 'Optional: source name, e.g. Axios'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/newsroom.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          FORCE: ${{ inputs.force }}
          HEADLINE: ${{ inputs.headline }}
          HEADLINE_URL: ${{ inputs.headline_url }}
          HEADLINE_SOURCE: ${{ inputs.headline_source }}
      # Slop Machine™: designs paid mystery-merch orders (scripts/slopfactory.mjs). Runs even if the article step failed.
      - name: Slop orders waiting?
        id: peek
        if: always()
        run: if PEEK=1 node scripts/slopfactory.mjs; then echo "todo=1" >> "$GITHUB_OUTPUT"; fi
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Exact versions from scripts/package-lock.json, install scripts off, and no secrets in this step.
      - name: Install image tools
        if: always() && steps.peek.outputs.todo == '1'
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - name: Slop Machine
        if: always() && steps.peek.outputs.todo == '1'
        run: node scripts/slopfactory.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_SLOP_KEY: ${{ secrets.OPENROUTER_SLOP_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SLOP_IMAGE_MODEL: ${{ vars.SLOP_IMAGE_MODEL }}
