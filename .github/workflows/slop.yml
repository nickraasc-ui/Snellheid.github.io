name: Slop Machine

# Designs paid Slop Machine orders (scripts/slopfactory.mjs).
# Started by the shop function the moment an order is paid (needs the GITHUB_DISPATCH_TOKEN Supabase secret);
# the hourly Newsroom run also checks, in case that start got lost.
# Run it by hand with "sample" set to see a design without an order (costs one image, a few cents).
on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Make a sample design instead of processing orders'
        type: choice
        options: [none, sticker, mug, poster, roulette-all, roulette-15, roulette-30, roulette-60]
        default: none

permissions:
  contents: read

concurrency:
  group: slop
  cancel-in-progress: false

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Exact versions from scripts/package-lock.json, install scripts off, and no secrets in this step.
      - run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - run: node scripts/slopfactory.mjs
        env:
          SAMPLE: ${{ inputs.sample != 'none' && inputs.sample || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_SLOP_KEY: ${{ secrets.OPENROUTER_SLOP_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SLOP_IMAGE_MODEL: ${{ vars.SLOP_IMAGE_MODEL }}
